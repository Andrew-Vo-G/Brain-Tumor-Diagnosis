<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profiles | brainAI studio</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            vertical-align: middle;
        }
    </style>

<body class="bg-surface font-body text-on-surface">

    <!-- Navigation and Sidebar inserted by update_ui.py -->
    <nav class="fixed top-0 w-full z-50 bg-slate-50/80 backdrop-blur-xl shadow-sm border-none">
        <div class="flex justify-between items-center px-6 py-3 w-full max-w-screen-2xl mx-auto">
            <div class="flex items-center gap-8">
                <span class="text-xl font-bold tracking-tighter text-blue-800 font-headline">brainAI Studio</span>
                <div class="hidden md:flex gap-6 items-center">
                </div>
            </div>
            <div class="flex items-center gap-4">
                <p id="topUserName" class="text-sm font-semibold text-slate-700"></p>
                <p id="topUserRole" class="text-xs text-slate-500 hidden"></p>
                <button id="logoutBtn"
                    class="px-3 py-1.5 bg-red-500 text-white rounded-lg text-xs font-bold hover:bg-red-600 transition shadow">Logout</button>
            </div>
        </div>
    </nav>

    <div class="flex pt-16 min-h-screen">
        <!-- SideNavBar -->
        <aside class="hidden lg:flex flex-col h-[calc(100vh-64px)] w-64 bg-slate-50 p-4 gap-2 border-r-0 fixed left-0">
            <div class="flex items-center gap-3 px-3 py-4 mb-4">
                <div class="w-10 h-10 bg-primary-container rounded-xl flex items-center justify-center text-on-primary">
                    <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">psychology</span>
                </div>
                <div>
                    <h2 class="text-blue-700 font-extrabold text-lg leading-tight">brainAI</h2>
                    <p class="text-xs text-slate-500 uppercase tracking-widest font-semibold">Clinical Portal</p>
                </div>
            </div>
            <nav class="flex-1 flex flex-col gap-1 sidebar-nav-links">
                <a class="nav-btn flex items-center gap-3 px-4 py-2.5 text-slate-600 hover:bg-slate-100 hover:translate-x-1 transition-all rounded-lg font-['Inter'] text-sm font-medium"
                    href="doctor-dashboard.html" data-page="doctor-dashboard">
                    <span class="material-symbols-outlined" data-icon="dashboard">dashboard</span> Dashboard (Dr)
                </a>
                <a class="nav-btn flex items-center gap-3 px-4 py-2.5 text-slate-600 hover:bg-slate-100 hover:translate-x-1 transition-all rounded-lg font-['Inter'] text-sm font-medium"
                    href="patient.html" data-page="patient">
                    <span class="material-symbols-outlined" data-icon="dashboard">dashboard</span> Dashboard (Pt)
                </a>
                <a class="nav-btn flex items-center gap-3 px-4 py-2.5 text-slate-600 hover:bg-slate-100 hover:translate-x-1 transition-all rounded-lg font-['Inter'] text-sm font-medium"
                    href="analysis.html" data-page="analysis">
                    <span class="material-symbols-outlined" data-icon="troubleshoot">troubleshoot</span> Analysis
                </a>
                <a class="nav-btn flex items-center gap-3 px-4 py-2.5 text-slate-600 hover:bg-slate-100 hover:translate-x-1 transition-all rounded-lg font-['Inter'] text-sm font-medium"
                    href="history.html" data-page="history">
                    <span class="material-symbols-outlined" data-icon="folder_shared">history</span> Records
                </a>
                <a class="nav-btn flex items-center gap-3 px-4 py-2.5 text-slate-600 hover:bg-slate-100 hover:translate-x-1 transition-all rounded-lg font-['Inter'] text-sm font-medium"
                    href="appointments.html" data-page="appointments">
                    <span class="material-symbols-outlined" data-icon="event">event</span> Appointments
                </a>
                <a class="nav-btn flex items-center gap-3 px-4 py-2.5 text-slate-600 hover:bg-slate-100 hover:translate-x-1 transition-all rounded-lg font-['Inter'] text-sm font-medium"
                    href="profiles.html" data-page="profiles">
                    <span class="material-symbols-outlined" data-icon="group">group</span> Profiles
                </a>
                <a class="nav-btn flex items-center gap-3 px-4 py-2.5 text-slate-600 hover:bg-slate-100 hover:translate-x-1 transition-all rounded-lg font-['Inter'] text-sm font-medium"
                    href="messages.html" data-page="messages">
                    <span class="material-symbols-outlined" data-icon="chat">chat</span> Messages
                </a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 lg:ml-64 p-8 bg-surface">
            <div class="max-w-6xl mx-auto space-y-8">

                <div class="bg-white rounded-lg border p-4 space-y-3">
                    <div class="flex items-center gap-2">
                        <label class="text-sm">Patient:</label>
                        <select id="patientSelect" class="border rounded px-2 py-1 text-sm flex-1"></select>
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <input id="heightInput" type="number" class="border rounded px-3 py-2 text-sm"
                            placeholder="Height (cm)" />
                        <input id="weightInput" type="number" class="border rounded px-3 py-2 text-sm"
                            placeholder="Weight (kg)" />
                    </div>
                    <button id="saveBtn" class="px-4 py-2 rounded bg-blue-600 text-white text-sm">Save Profile</button>
                    <p id="profileStatus" class="text-xs text-slate-500">Ready</p>
                </div>

            </div>
        </main>
    </div>
    <!-- Mobile Navigation -->
    <div
        class="md:hidden fixed bottom-0 left-0 w-full bg-slate-50 border-t border-slate-200 z-50 px-6 py-2 flex justify-between items-center hide-patient">
        <button onclick="window.location.href='doctor-dashboard.html'"
            class="flex flex-col items-center gap-1 p-2 text-slate-500">
            <span class="material-symbols-outlined">dashboard</span>
            <span class="text-[10px] font-bold">Home</span>
        </button>
        <div class="relative -top-6">
            <button onclick="window.location.href='analysis.html'"
                class="w-14 h-14 bg-primary text-white rounded-full shadow-xl flex items-center justify-center">
                <span class="material-symbols-outlined text-3xl">add</span>
            </button>
        </div>
        <button onclick="window.location.href='history.html'"
            class="flex flex-col items-center gap-1 p-2 text-slate-500">
            <span class="material-symbols-outlined">folder_shared</span>
            <span class="text-[10px] font-bold">Records</span>
        </button>
    </div>
    </div>

    <script src="js/api.js?v=23"></script>
    <script src="js/pages/common.js?v=3"></script>
    <script src="js/pages/profiles.js?v=1"></script>
</body>

</html>
